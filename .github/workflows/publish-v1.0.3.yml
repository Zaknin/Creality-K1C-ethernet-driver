name: Publish verified K1C v1.0.3 draft

on:
  push:
    branches:
      - release/v1.0.3-rc1
    paths:
      - .github/workflows/publish-v1.0.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the immutable v1.0.3 tag
        uses: actions/checkout@v4
        with:
          ref: v1.0.3
          fetch-depth: 0

      - name: Confirm immutable tested driver and release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ad5af5d265374944288fd7572c189c46b3c3cec4"
          test "$(git rev-parse v1.0.3^{commit})" = "ad5af5d265374944288fd7572c189c46b3c3cec4"
          echo 'f12a6cc8faf904a72cb44e21e6ec520efe24b37ae9999a40a1ca0183517d7271  package/modules/cdc_ncm.ko' | sha256sum -c -
          (cd package && sha256sum -c module-hashes.sha256 && sha256sum -c SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Confirm draft ID, tag and exact four asset digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/412071396" > "$RUNNER_TEMP/draft.json"
          python3 - "$RUNNER_TEMP/draft.json" <<'PY'
          import hashlib, json, pathlib, sys
          r = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert r["id"] == 412071396, "Unexpected release ID"
          assert r["tag_name"] == "v1.0.3", "Wrong tag"
          assert r["draft"] is True, "Release is not a draft"
          assert r["prerelease"] is False, "Unexpected prerelease"
          expected = {}
          for line in pathlib.Path("dist/SHA256SUMS").read_text().splitlines():
              digest, name = line.split("  ", 1)
              expected[name] = "sha256:" + digest
          expected["SHA256SUMS"] = "sha256:" + hashlib.sha256(
              pathlib.Path("dist/SHA256SUMS").read_bytes()).hexdigest()
          actual = {a["name"]: a.get("digest") for a in r["assets"]}
          assert len(r["assets"]) == 4 and actual == expected, (
              "Remote asset names/digests mismatch: " + repr(actual))
          print("DRAFT ASSET DIGESTS: PASS; four exact files")
          PY

      - name: Download and verify uploaded files before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-verified"
          cd "$RUNNER_TEMP/release-verified"
          gh release download v1.0.3 --repo "$GITHUB_REPOSITORY" --dir .
          test "$(find . -maxdepth 1 -type f | wc -l)" = 4
          sha256sum -c SHA256SUMS
          for name in \
            SHA256SUMS \
            k1c-usb-ethernet-v1.0.3-runtime.tar.gz \
            k1c-usb-ethernet-v1.0.3-runtime.zip \
            k1c-usb-ethernet-v1.0.3-source.tar.gz; do
            cmp "$name" "$GITHUB_WORKSPACE/dist/$name"
          done
          echo 'REMOTE DOWNLOAD VERIFICATION: PASS'

      - name: Publish preverified draft by immutable release ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/412071396" \
            -F draft=false -f make_latest=true --jq .html_url
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.3" --jq .draft)" = false
          echo 'v1.0.3 RELEASE PUBLISHED'
